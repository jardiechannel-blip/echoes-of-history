
name: Echoes of History - Video Engine

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Test video engine
        run: |
          mkdir -p output
          ffmpeg -f lavfi -i color=c=black:s=1280x720:d=5 \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -shortest -c:v libx264 -pix_fmt yuv420p \
            -c:a aac output/test.mp4

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/test.mp4
